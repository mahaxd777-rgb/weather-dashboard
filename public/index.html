<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather updates for any city</p>
        </header>

        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Enter city name..." 
                class="search-input"
                autocomplete="off"
            >
            <button id="searchBtn" class="search-btn">Search</button>
            <button id="locationBtn" class="location-btn" title="Use your location">📍</button>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <div id="weatherContent" class="weather-content hidden">
            <!-- Current Weather Section -->
            <div class="current-weather">
                <div class="weather-header">
                    <div class="city-info">
                        <h2 id="cityName">City Name</h2>
                        <p id="weatherDescription">Weather condition</p>
                    </div>
                    <div class="temperature">
                        <span id="temp" class="temp-value">--°C</span>
                        <img id="weatherIcon" src="" alt="Weather icon" class="weather-icon-large">
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail-card">
                        <span class="detail-label">Feels Like</span>
                        <span id="feelsLike" class="detail-value">--°C</span>
                    </div>
                    <div class="detail-card">
                        <span class="detail-label">Humidity</span>
                        <span id="humidity" class="detail-value">--%</span>
                    </div>
                    <div class="detail-card">
                        <span class="detail-label">Wind Speed</span>
                        <span id="windSpeed" class="detail-value">-- m/s</span>
                    </div>
                    <div class="detail-card">
                        <span class="detail-label">Pressure</span>
                        <span id="pressure" class="detail-value">-- hPa</span>
                    </div>
                    <div class="detail-card">
                        <span class="detail-label">Visibility</span>
                        <span id="visibility" class="detail-value">-- km</span>
                    </div>
                    <div class="detail-card">
                        <span class="detail-label">UV Index</span>
                        <span id="uvIndex" class="detail-value">--</span>
                    </div>
                </div>
            </div>

            <!-- Forecast Section -->
            <div class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div id="forecastContainer" class="forecast-container"></div>
            </div>
        </div>

        <footer class="footer">
            <p>Data provided by <a href="https://openweathermap.org" target="_blank">OpenWeatherMap API</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
